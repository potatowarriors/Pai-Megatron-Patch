# alpha fleet 용 NeMo-Gym 모델 서버 (평가용, 토큰 ID 없음).
# 전제: fleet 는 `eval_sft/serve_alpha.sh` 를 TOOLS=1 REASONING_PARSER=nemotron_v3 로 띄운다.
#   - uses_reasoning_parser: true 인데 vLLM 이 reasoning 키를 안 주면 Gym 이 assert 로 중단한다 (설계상 의도: 파서 누락을 조용히 넘기지 않음).
#   - 이전 턴 추론은 Gym 이 reasoning_content 필드로 되돌려 보내고, restore/strip 은 alpha 템플릿(truncate_history_thinking) 이 결정한다.
#     도구 미선언 하니스(TB-2) 는 alpha_vllm_model_tb2.yaml 을 쓴다.
# 값은 env.yaml 또는 CLI `++policy_base_url=...` 로 채운다 (env.yaml.example 참조).
policy_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${policy_base_url}
      api_key: ${policy_api_key}
      model: ${policy_model_name}
      return_token_id_information: false
      uses_reasoning_parser: true
      uses_interleaved_reasoning: true
      chat_template_kwargs: null
      extra_body: null
