# τ²-bench (airline·retail·telecom) 를 alpha 정책 + Gemini 사용자 시뮬레이터로 돌리는 벤치 설정.
# 원형: <Gym>/benchmarks/tau2/configs/tau2.yaml (시뮬레이터가 OpenAI gpt-5.2 로 고정) 에서 시뮬레이터만 교체.
# 데이터: <Gym>/benchmarks/tau2/data/tau2_benchmark.jsonl (`python benchmarks/tau2/prepare.py`, 278행 — 2026-09-15 준비 완료).
# 정책 모델 서버(policy_model) 는 alpha_vllm_model*.yaml 을 --config 로 함께 넘긴다.
# 시뮬레이터 키·모델명은 env.yaml 의 user_sim_api_key / user_sim_model_name 또는 CLI `++user_sim_api_key=...`.
# 주의: telecom 은 시뮬레이터 엔드포인트가 tools 를 받아야 한다(우리 τ³ 트랙과 같은 제약). Gemini OpenAI 호환 엔드포인트는 tools 를 받는다.
config_paths:
  - responses_api_agents/tau2/configs/tau2.yaml

user_sim_gemini:
  responses_api_models:
    inference_provider:
      entrypoint: app.py
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      api_key: ${user_sim_api_key}
      model: ${user_sim_model_name}

tau2_alpha_agent:
  _inherit_from: tau2_agent
  responses_api_agents:
    tau2:
      model_server:
        type: responses_api_models
        name: policy_model
      user_model_server:
        type: responses_api_models
        name: user_sim_gemini
      num_workers: 16
      print_step_counts: true
      datasets:
      - name: tau2
        type: benchmark
        jsonl_fpath: benchmarks/tau2/data/tau2_benchmark.jsonl
        prompt_config: null
        prepare_script: benchmarks/tau2/prepare.py
        num_repeats: 8
