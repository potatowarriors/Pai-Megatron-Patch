# HMMT February 2025 (30 problems) — DSV4 표 "HMMT 2026 Feb" 자리의 공개 대체
# aime25 태스크와 동일 파이프라인 (boxed/$..$ 추출 + is_equiv). 데이터: MathArena/hmmt_feb_2025
tag:
  - math_word_problems
task: hmmt_feb_2025
dataset_path: MathArena/hmmt_feb_2025
output_type: generate_until
training_split: train
fewshot_split: train
test_split: train
doc_to_text: "Question: {{problem}}\nAnswer:"
doc_to_target: "{{answer}}"
process_results: !function math_utils.process_results
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  until:
    - "Question:"
    - "<|im_end|>"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 32768
repeats: 1
num_fewshot: 0
metadata:
  version: 0.0
