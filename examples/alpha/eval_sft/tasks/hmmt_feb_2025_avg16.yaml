# HMMT Feb 2025 avg@16 (R1 표준: temp 0.6, top_p 0.95, 16 samples pass@1 평균)
tag: [math_word_problems]
task: hmmt_feb_2025_avg16
dataset_path: MathArena/hmmt_feb_2025
output_type: generate_until
training_split: train
fewshot_split: train
test_split: train
doc_to_text: "Question: {{problem}}\nAnswer:"
doc_to_target: "{{answer}}"
process_results: !function math_utils.process_results
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  until: ["Question:", "<|im_end|>"]
  do_sample: true
  temperature: 0.6
  top_p: 0.95
  max_gen_toks: 32768
repeats: 16
num_fewshot: 0
metadata:
  version: 1.0
