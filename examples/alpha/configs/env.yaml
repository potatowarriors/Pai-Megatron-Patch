# Alpha 프로젝트 환경 변수 설정
# H100 최적화 및 안정성 개선

environment:
  # Megatron 경로
  megatron_version: "Megatron-LM-251125"  # Dev branch with Muon optimizer support

  # CUDA 설정
  cuda:
    device_max_connections: 1
    alloc_conf: "expandable_segments:True"  # PyTorch 메모리 최적화

  # PyTorch 설정
  pytorch:
    force_no_weights_only_load: true  # PyTorch ≥2.6 호환성

  # TransformerEngine 최적화 (Best Practice)
  transformer_engine:
    # Normalization CuDNN 가속
    norm_fwd_use_cudnn: 1
    norm_bwd_use_cudnn: 1
    allow_nondeterministic_algo: 1

    # Attention Backend: Flash Attention (H100 최적화)
    flash_attn: 1
    fused_attn: 0

  # NCCL 설정 (H100 안정성)
  nccl:
    debug: "VERSION"
    # nvls_enable: 0  # H100에서 불안정할 수 있음 (필요시 활성화)

  # CPU 스레드 관리 (220-core 시스템)
  # DataLoader workers와 OpenMP 스레드 균형
  threading:
    omp_num_threads: 8           # 워커당 OpenMP 스레드
    numexpr_max_threads: 256     # numexpr 제한 (32 workers × 8)
    mkl_num_threads: 8           # Intel MKL 스레드
    # 총 스레드: 32 workers × 8 threads = 256

  # 프로파일링 (디버깅용)
  profiling:
    enabled: false
    nsys_profile: false

  # 학습 모드
  mode:
    pretrain: true               # Scratch 학습 여부
    moe_grouped_gemm: true       # MoE grouped GEMM 최적화

# 환경 변수 export 예시 (train.sh에서 사용):
# export CUDA_DEVICE_MAX_CONNECTIONS=1
# export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
# export NVTE_NORM_FWD_USE_CUDNN=1
# export NVTE_NORM_BWD_USE_CUDNN=1
# export NVTE_ALLOW_NONDETERMINISTIC_ALGO=1
# export NVTE_FLASH_ATTN=1
# export NVTE_FUSED_ATTN=0
# export NCCL_DEBUG=VERSION
# export OMP_NUM_THREADS=8
# export NUMEXPR_MAX_THREADS=256
# export MKL_NUM_THREADS=8
