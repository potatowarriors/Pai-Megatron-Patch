# SFT phase-1 iter 1200 데이터 교체 블렌드 — **phase-1 yaml 과 가중치 비트 동일, 경로 2개만 치환** (2026-09-01)
#   opencode_v1 → opencode_fixed (동일 460,254행, tool-result 평문 재렌더)   identity_v1 → identity_v2 (카드 1.2 creator 교체)
#   나머지 24 멤버는 phase-1 트리 경로·가중치 그대로.
# 왜 가중치를 바꾸지 않나: Megatron 은 재개 시 샘플러가 consumed_samples(192,000)부터 인덱스를 이어 갈 뿐이고, 블렌드
#   인덱스(build_blending_indices)는 가중치·총량만의 함수, 각 셋의 셔플은 (요청 샘플 수 = 가중치×총량, seed 1234)의
#   함수다. 가중치가 같으면 24 미변경 셋의 순열이 phase-1 과 동일 → 192,000번부터가 **진짜 연속**(경계 중복·누락 0).
#   가중치를 재정규화하면 새 순열이 되어 앞 1200 iters 와 무관한 샘플이 뽑힌다 (SWE 1.00ep 앵커가 ≈25% 중복·25% 누락으로
#   깨짐). 교체 멤버 2개는 자기 자리(가중치)를 승계하고 내부 순열만 새로 만든다.
# 잔여 1,248 iters 노출: opencode_fixed 0.16ep(누적 repr 0.15 + 정상 0.16 = 0.31 = 원설계) · identity_v2 0.43% ≈ 112M tok
#   (원본 1.15M tok 기준 ≈97회; v1 은 ≈91회에서 중단). 미변경 셋 누적 = phase-1 설계값 그대로 (SWE 1.00 · chat 1.88 · cp 0.45).
