# KORMo 1% subset: DCLM (English, ~95%) + korean_web (Korean, ~5%).
# Weights omitted → Megatron auto-mixes proportional to dataset size.

# Megatron --data-path accepts a space-separated list of "path path..." (no
# weights → size-proportional) or "weight path weight path..." (explicit).
# yaml_to_flags emits the value as a single argv token; argparse re-splits
# because --data-path is nargs='*'.
data-path: "/home/work/vidsearch/repos/project_s/Pai-Megatron-Patch/datasets/processed/qwen3_1pct_blended/dclm_content_document /home/work/vidsearch/repos/project_s/Pai-Megatron-Patch/datasets/processed/qwen3_1pct_blended/korean_web_content_document"
split: "99,1,0"
dataset: MMAP                  # megatron_patch dataset selector (data/__init__.py:116)
num-workers: 32

