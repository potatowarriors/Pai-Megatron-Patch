# Stage 2 v5 — full continual-learning blend re-tokenized with the alpha v5 tokenizer.
#
# Reproduces examples/alpha/configs/data/arxive/stage2.yaml (the pre-migration
# Stage-2 blend, originally Qwen3-tokenized vocab 151,936) in the new alpha v5
# vocabulary (effective 163,860 / padded 163,968), PLUS the FineWeb2-HQ 2nd half
# (the complementary stage-2 half of the stage-1 corpus, per stage1_v5_blend.yaml).
# Use only with baseline_48L.yaml (matching tokenizer-model + padded-vocab-size).
#
# 10 blend entries (5 categories), produced by:
#   toolkits/pretrain_data_preprocessing/run_stage2_v5.sh   (fast_tokenize_v5.py path)
#
#   Korean Web (2nd half)  : REUSED v5 korean_web (remapped EOD 3→0)
#   FineWeb2-HQ (2nd half) : REUSED v5 fineweb2hq (remapped EOD 3→0)
#   Math                   : Nemotron-CC-Math-v1 (3 / 4plus / 4plus_MIND)
#   Nemotron Code v2       : 5 synthetic subsets (each its own .bin, as in legacy)
#   Nemotron CC-HQ         : actual + diverse_qa_pairs (restored from MinIO)
#
# Blending: weight-less — Megatron's BlendedMegatronDatasetConfig auto-infers
# weights from per-dataset sample counts (= .idx length) which, under a constant
# --seq-length, equals proportional-to-token-count mixing (same convention as
# stage1_v5_blend.yaml).
#
# Measured v5 token counts (sum(seq_lens), verified by Phase B 2026-06-26):
#   TOTAL 1,686,051,133,040 tokens (1.686T)
#     cchq_actual          530.20B  31.45%   ┐
#     cchq_qa_pairs        475.66B  28.21%   ┘ CC-HQ      59.7%
#     question_answering   241.15B  14.30%   ┐
#     math                 204.99B  12.16%   │ (Math is its own category 12.2%)
#     code_review           77.06B   4.57%   │
#     rewriting             77.18B   4.58%   │ Code       26.7%
#     transpilation         29.27B   1.74%   │
#     student_teacher       25.80B   1.53%   ┘
#     korean_web            19.02B   1.13%     Korean      1.1%
#     fineweb2hq             5.72B   0.34%     FineWeb     0.3%
#
# Budget control: train the corpus partially via --train-samples (NOT the full
# 1.686T). seq_length 4096 → train_samples = tokens/4096 (e.g. 0.7T = 170898438).
# At 0.7T every source is ~0.42 epoch (corpus = 2.4× budget, zero repetition).
#
# To override proportions, prepend explicit weights per prefix (see
# tools/compute_blend_weights.py), e.g.:
#   data-path: "0.05 /…/korean_web/data_text_document 0.15 /…/math/data_text_document …"

data-path: "/home/work/Datasets/LL_preprocessed/v5/stage2/korean_web/data_text_document /home/work/Datasets/LL_preprocessed/v5/stage2/fineweb2hq/data_text_document /home/work/Datasets/LL_preprocessed/v5/stage2/math/data_text_document /home/work/Datasets/LL_preprocessed/v5/stage2/code/code_review/data_text_document /home/work/Datasets/LL_preprocessed/v5/stage2/code/question_answering/data_text_document /home/work/Datasets/LL_preprocessed/v5/stage2/code/rewriting/data_text_document /home/work/Datasets/LL_preprocessed/v5/stage2/code/student_teacher/data_text_document /home/work/Datasets/LL_preprocessed/v5/stage2/code/transpilation/data_text_document /home/work/Datasets/LL_preprocessed/v5/stage2/nemotron_cc_hq/actual/data_text_document /home/work/Datasets/LL_preprocessed/v5/stage2/nemotron_cc_hq/qa_pairs/data_text_document"
