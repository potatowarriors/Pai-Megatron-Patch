# KORMo 데이터셋 설정 (50% subset) - Blended Dataset
# DCLM(영어) + korean_web(한글) 균일 혼합
# 원본 ~2T tokens의 50% = ~1.13T tokens

data:
  # Blended dataset (가중치 생략 시 데이터 크기 비례로 자동 혼합)
  # DCLM 1.9TB (~90%), korean_web 208GB (~10%)
  blend:
    - path: "/home/work/vidsearch/repos/project_s/Pai-Megatron-Patch/datasets/processed/qwen3_50pct/dclm/dclm_content_document"
    - path: "/home/work/vidsearch/repos/project_s/Pai-Megatron-Patch/datasets/processed/qwen3_50pct/korean_web/korean_web_content_document"

  # 데이터셋 타입
  dataset_impl: "MMAP"

  # Train/Valid/Test split
  split: [99, 1, 0]  # 99% train, 1% valid, 0% test

  # 데이터 로더
  num_workers: 32

  # 데이터셋 정보
  description: "KORMo corpus 50% blended (DCLM + korean_web)"
  tokenizer: "Qwen3Tokenizer"

  # 데이터셋 통계 (참고용)
  # bin 파일 크기 / 2 bytes = 토큰 수
  stats:
    dclm_tokens: 1019935360766       # ~1.02T tokens
    korean_web_tokens: 110176971194  # ~0.11T tokens
    total_tokens: 1130112331960      # ~1.13T tokens
    dclm_documents: 356607001
    korean_web_documents: 40298038
