# Alpha Baseline 모델 설정
# 최초 실험 성공 모델 (2025-01-17)
# Qwen3-Next-80B-A3B 기반, H100 8-GPU 최적화
#
# 주요 변경사항 (Original 대비):
# - 24 layers (96 → 24, 75% reduction)
# - 256 experts (512 → 256, 50% reduction)
# - Kimi-Linear 정렬: 많은 heads (32) + 작은 head_dim (64)
# - Expert size 증가로 fewer experts 보상

model:
  name: "alpha-baseline-24L"
  architecture: "qwen3_next_mamba_hybrid"

  # 기본 아키텍처
  num_layers: 24
  hidden_size: 2048
  ffn_hidden_size: 5120  # 2.5x ratio

  # Attention (Kimi-Linear 정렬)
  num_attention_heads: 32      # Original: 16 → 많은 heads
  kv_channels: 128              # head_dim: 64 (256 → 128 채널)
  group_query_attention: true
  num_query_groups: 2

  # MoE 설정
  moe:
    num_experts: 256             # Original: 512
    moe_ffn_hidden_size: 768     # Original: 512 (50% 증가로 보상)
    router_topk: 8               # Original: 10
    router_load_balancing_type: "aux_loss"
    aux_loss_coeff: 0.001
    router_score_function: "softmax"
    router_dtype: "fp32"
    grouped_gemm: true
    permute_fusion: true
    router_fusion: true
    shared_expert_intermediate_size: 768  # Expert size와 동일

  # Hybrid Model (Mamba + Attention)
  hybrid:
    attention_ratio: 0.125       # 12.5% (24 layers 중 3개)
    mlp_ratio: 0.5
    override_pattern: "M-M-M-*-M-M-M-*-M-M-M-*-"  # 24 layers: 6 groups, 3 attention
    mamba_state_dim: 128
    mamba_head_dim: 64           # Original: 128 (attention과 정렬)
    mamba_num_groups: 16
    mamba_num_heads: 32

  # Normalization
  normalization: "RMSNorm"
  norm_epsilon: 1.0e-6
  qk_layernorm: true
  apply_layernorm_1p: true

  # Activation & Dropout
  activation: "swiglu"
  attention_dropout: 0.0
  hidden_dropout: 0.0
  disable_bias_linear: true

  # Positional Encoding (RoPE)
  position_embedding_type: "rope"
  use_rotary_position_embeddings: true
  rotary_base: 10000000
  rotary_percent: 0.25

  # Tokenizer & Vocab
  untie_embeddings_and_output_weights: true
  padded_vocab_size: 151936
  tokenizer_type: "Qwen3Tokenizer"
  tokenizer_path: "/home/work/vidsearch/repos/project_s/Pai-Megatron-Patch/models/Qwen3-Next-tokenizer"

# 메모리 효율성 노트:
# - 24 layers: ~75% 레이어 감소
# - 256 experts: 50% expert 감소
# - head_dim 64: 4x attention 메모리 감소
# - Compensations:
#   - 더 많은 heads (16 → 32): diversity 유지
#   - 더 큰 expert (512 → 768): capacity 유지
#   - Shared expert size 증가: 정보 공유 강화

