# Alpha baseline 48L model (Qwen3.5 dimensioning + DSV3 MoE recipe, hybrid).
#
# Each top-level key here is a Megatron CLI flag — `train.sh`'s yaml_to_flags
# helper expands `num-layers: 48` into `--num-layers 48`. Booleans:
#   key: true  -> emit --key (works for store_true and store_false-with-dest)
#   key: false -> omit
# So the file *is* the source-of-truth argv contribution for the model.
#
# Migration notes (Qwen3-Next → Qwen3.5 dimensioning + DSV3 MoE routing):
#   - Q upcast adopted: head_dim 64 → 256, total Q dim 2048 → 4096 (Qwen3.5).
#   - Expert FFN narrowed (768 → 512) and expert count grown (128 → 184) to
#     keep total ~15B (verified 15.03B via calculate_parameters.py) while
#     adopting Qwen3.5 expert dim (Qwen3.5 official is 256 × 512; alpha is
#     184 × 512 to land at ~15B vs Qwen3.5 ~30B).
#   - DSV3-style MoE routing flags added (group-limited, topk scaling).

# ── Architecture ───────────────────────────────────────────────────────────
num-layers: 48
hidden-size: 2048
ffn-hidden-size: 8192
num-attention-heads: 16
kv-channels: 256

# Group Query Attention (head_dim=256 uniform; Q upcast: 16 heads × 256 = 4096)
group-query-attention: true
num-query-groups: 2

# ── MoE (DSV3-style routing on Qwen3.5 expert dim) ─────────────────────────
num-experts: 184                  # 8-multiple round, lands at ~15.0B total at FFN=512
moe-ffn-hidden-size: 512          # Qwen3.5 expert dim
moe-router-topk: 8
moe-aux-loss-coeff: 1.0e-4        # DSV3 best practice (was 0.001; 10× smaller)
moe-router-dtype: fp32
moe-grouped-gemm: true
moe-permute-fusion: true
moe-router-fusion: true
moe-shared-expert-intermediate-size: 512   # Qwen3.5 shared expert dim
moe-shared-expert-gate: true

# DSV3 group-limited routing: 8 groups × 23 experts/group, token sees top-4
# groups (92 candidate experts). Reduces all-to-all communication ~50%.
moe-router-num-groups: 8
moe-router-group-topk: 4
moe-router-topk-scaling-factor: 2.5   # DSV3: compensates sigmoid+topk geometric reduction

# NOTE: moe-router-load-balancing-type / moe-router-score-function /
# moe-router-enable-expert-bias / moe-router-bias-update-rate live in the
# *training* preset, because Stage 1 (aux-loss-free, none + sigmoid + bias)
# and Stage 2 (DSV3 seq_aux_loss + sigmoid + bias) differ on balancing-type.

# ── Hybrid (Mamba + Attention) ─────────────────────────────────────────────
is-hybrid-model: true
hybrid-attention-ratio: 0.125
hybrid-mlp-ratio: 0.5
# 48 layers: M(18) + D(0) + -(24) + *(6) = 48. M=GatedDeltaNet, D=Dense MLP,
# -=MoE, *=Attention. Currently 0 dense MLPs (D removed in latest baseline).
hybrid-override-pattern: "M-M-M-*-M-M-M-*-M-M-M-*-M-M-M-*-M-M-M-*-M-M-M-*-"
mamba-state-dim: 128
mamba-head-dim: 128
mamba-num-groups: 16
mamba-num-heads: 32

# ── Normalization & activation ─────────────────────────────────────────────
# Standard RMSNorm with gamma=1 init (Qwen3.5 alignment). apply-layernorm-1p
# (zero-centered gamma) was removed to match Qwen3.5 official RMSNorm. The
# QK-Clip _clip_layernorm_gamma() in gated_attention.py auto-falls-through to
# the non-1p branch (w * scale) when this flag is off — no code change needed.
normalization: RMSNorm
norm-epsilon: 1.0e-6
qk-layernorm: true
swiglu: true
attention-dropout: 0.0
hidden-dropout: 0.0
disable-bias-linear: true

# ── Positional encoding (RoPE) ─────────────────────────────────────────────
position-embedding-type: rope
use-rotary-position-embeddings: true
rotary-base: 10000000
rotary-percent: 0.25

# ── Sequence length ────────────────────────────────────────────────────────
# seq-length is the actual training context (4K). max-position-embeddings is
# kept at 262144 (Qwen3-Next-80B's yarn-extended max) so that RoPE inverse
# frequencies are computed for long-context inference compatibility.
seq-length: 4096
max-position-embeddings: 262144

# ── Tokenizer & vocab ──────────────────────────────────────────────────────
# Alpha-specific tokenizer v5 (PreTrainedTokenizerFast, BBPE). Replaces
# previous Qwen-compatible tokenizer. Effective len(tokenizer) = 163,860 (163,840
# base + 80 reserved special tokens); padded to multiple of 128 → 163,968.
# Special tokens: EOS=<|im_end|>, PAD=<|pad|>, BOS=None, plus <|im_start|>,
# <|fim_*|>, <tool_call>, <think>, <|endoftext|>, and 80 reserved slots.
untie-embeddings-and-output-weights: true
padded-vocab-size: 163968
tokenizer-type: HuggingFaceTokenizer
tokenizer-model: /home/work/vidsearch/repos/project_s/Pai-Megatron-Patch/examples/alpha/tokenizer_v5

# ── Backend wiring ─────────────────────────────────────────────────────────
use-mcore-models: true
transformer-impl: transformer_engine
