# Alpha Baseline 48L 모델 설정
# 24L 모델의 2배 depth 버전
# Qwen3-Next-80B-A3B 기반, H100 8-GPU 최적화
#
# 주요 변경사항 (24L 대비):
# - 48 layers (24 → 48, 2x depth)
# - 동일한 256 experts, hidden_size 유지
# - Attention 6개 (12.5% 비율 유지)

model:
  name: "alpha-baseline-48L"
  architecture: "qwen3_next_mamba_hybrid"

  # 기본 아키텍처
  num_layers: 24
  hidden_size: 1024
  ffn_hidden_size: 4096  # 4x ratio

  # Attention (Kimi-Linear 정렬)
  num_attention_heads: 16      # Original: 16 → 많은 heads
  kv_channels: 64              # head_dim: 64 (256 → 128 채널)
  group_query_attention: true
  num_query_groups: 2

  # MoE 설정
  moe:
    num_experts: 64             # Original: 512
    moe_ffn_hidden_size: 512     # Original: 512 (50% 증가로 보상)
    router_topk: 8               # Original: 10
    router_load_balancing_type: "aux_loss"
    aux_loss_coeff: 0.001
    router_score_function: "softmax"
    router_dtype: "fp32"
    grouped_gemm: true
    permute_fusion: true
    router_fusion: true
    shared_expert_intermediate_size: 768   # Expert size와 동일

  # Hybrid Model (Mamba + Attention)
  hybrid:
    attention_ratio: 0.125      # 12.5% (48 layers 중 6개)
    mlp_ratio: 0.5
    # 48 layers: M(18개) + D(1개) + -(23개) + *(6개) = 48
    # M=GatedDeltaNet, D=Dense MLP, -=MoE, *=Attention
    override_pattern: "MDM-M-*-M-M-M-*-M-M-M-*-"
    mamba_state_dim: 128
    mamba_head_dim: 128          # GatedDeltaNet head dimension
    mamba_num_groups: 16
    mamba_num_heads: 32

  # Normalization
  normalization: "RMSNorm"
  norm_epsilon: 1.0e-6
  qk_layernorm: true
  apply_layernorm_1p: true

  # Activation & Dropout
  activation: "swiglu"
  attention_dropout: 0.0
  hidden_dropout: 0.0
  disable_bias_linear: true

  # Positional Encoding (RoPE)
  position_embedding_type: "rope"
  use_rotary_position_embeddings: true
  rotary_base: 10000000
  rotary_percent: 0.25

  # Tokenizer & Vocab
  untie_embeddings_and_output_weights: true
  padded_vocab_size: 151936
  # Use Megatron-LM standard tokenizer (HuggingFaceTokenizer)
  tokenizer_type: "HuggingFaceTokenizer"
  # 토크나이저는 examples/alpha/tokenizer/ 에 고정 위치
  # (symlink to models/Qwen3-Next-tokenizer)
  tokenizer_model: "tokenizer"

# 48L vs 24L 비교:
# - Depth: 48 layers (24L의 2배)
# - Experts: 128 (24L의 절반) → 총 expert capacity 유사
# - MoE layers: 23개 (24L: 11개) → 2배 이상
# - Attention: 6개 (24L: 3개) → 동일 비율 (12.5%)
# - Dense MLP: 1개 (첫 번째 MLP만)

