# Alpha Stage 2 Speed Test 설정
# DeepEP vs All-to-All throughput 비교용 짧은 테스트
#
# stage2.yaml 기반, 변경사항:
#   - train_iters: 200 (200 iter만 실행, ~15분)
#   - lr_warmup_iters: 10 (비율 유지)
#   - lr_decay_iters: 200
#   - lr_wsd_decay_iters: 20
#   - save_interval: 999999 (체크포인트 저장 비활성화)
#   - eval_interval: 999999 (eval 비활성화)
#   - wandb.enabled: false (WANDB 비활성화)
#
# 사용법:
#   # Test A: All-to-All
#   bash train_stage2.sh baseline_48L stage2_speedtest h100x8 stage2
#
#   # Test B: DeepEP
#   bash train_stage2.sh baseline_48L stage2_speedtest h100x8_deepep stage2
#
# 결과 비교:
#   grep "elapsed time per iteration" outputs/alpha_baseline_48L_stage2_*/logs/train.log | tail -150
#   → iteration 50~200 구간 평균 비교 (처음 ~50 iter는 warmup/compilation)

training:
  # Resume 설정 (stage2.yaml과 동일)
  resume:
    enabled: true
    load_checkpoint_path: "/home/work/vidsearch/repos/project_s/Pai-Megatron-Patch/examples/alpha/outputs/alpha_baseline_48L_cooldown_20260209_200711/checkpoints"
    finetune: true              # iteration=0, consumed_samples=0 리셋

  # Iteration 설정 (짧은 테스트용)
  train_iters: 200
  lr_warmup_iters: 10
  lr_decay_iters: 200
  lr_wsd_decay_iters: 20

  # LR Schedule — WSD (Warmup-Stable-Decay)
  lr: 1.0e-4
  min_lr: 1.0e-5
  lr_decay_style: "WSD"
  lr_wsd_decay_style: "cosine"

  # QK-Clip (stage2.yaml과 동일)
  qk_clip: true
  qk_clip_alpha: 0.5
  qk_clip_threshold: 100
  no_weight_decay_cond_type: apply_wd_to_qk_layernorm

  # Optimizer (stage2.yaml과 동일)
  optimizer: "dist_muon"
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.95
  muon_momentum: 0.95
  muon_use_nesterov: true
  muon_num_ns_steps: 5
  muon_scale_mode: "spectral"
  muon_fp32_matmul_prec: "medium"
  muon_tp_mode: "blockwise"
  muon_extra_scale_factor: 1.0
  init_method_std: 0.008
  clip_grad: 1.0

  # Checkpoint (저장 비활성화)
  save_interval: 999999
  save_optim: false
  ckpt_format: "torch_dist"
  precision: "bf16"

  # 평가 (비활성화)
  eval_iters: 8
  eval_interval: 999999

  # 기타 (stage2.yaml과 동일)
  distributed_timeout_minutes: 60
  manual_gc_interval: 5
  log_interval: 1

  # Weights & Biases (비활성화)
  wandb:
    enabled: false
    project: "alpha-pretraining"
    entity: ""
    save_dir: ""
    notes: "Speed test: DeepEP vs All-to-All"
