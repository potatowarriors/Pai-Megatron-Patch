# Stage 1 from-scratch pretraining with aux-loss-free MoE routing.
#
# All keys are Megatron CLI flag names — `train.sh` expands them via
# yaml_to_flags. Schedule is expressed in **samples** (token-based) instead
# of iterations so the token budget intent survives GBS changes:
#   tokens = samples × seq_length(4096)
#   iters  = samples ÷ global_batch_size(1536)
#
# Schedule: WSD (warmup-stable-decay), targeted 450B token budget over the
# 461.81B train pool of stage1_v5_blend (= 0.99 × 466.47B total). Leaves
# ~11.8B (2.6%) safety headroom so the run terminates cleanly without
# wrapping the dataset.
#
#   warmup:  0      → 2.929M samples  (=  12.00B tok, ~1,907 iters; linear, init_lr → lr=2e-4)
#   stable:  2.929M → 100.098M samples (= 398.00B tok, ~63,261 iters; flat at lr=2e-4)
#   decay:   100.098M → 109.864M samples (= 40.00B tok, ~6,358 iters; cosine, lr → min_lr=2e-5)
#   total:   109.864M samples           (= 450.00B tok, ~71,526 iters)
#
# All samples are integer multiples of GBS=1536, so update_train_iters()
# truncates cleanly with no leftover batch. Math verified against
# training.py:1161-1188 (iter-path × GBS == sample-path; byte-identical LR curve).

# ── Sample (token-based) schedule ──────────────────────────────────────────
train-samples: 109863936          # = 71,526 iters × 1536 → 450.003B tokens
lr-warmup-samples: 2929152        # =  1,907 iters × 1536 →  11.998B tokens
lr-decay-samples: 109863936       # WSD: full scope (= train-samples)
lr-wsd-decay-samples: 9765888     # =  6,358 iters × 1536 →  40.001B tokens

# ── LR ──────────────────────────────────────────────────────────────────────
lr: 2.0e-4
min-lr: 2.0e-5
lr-decay-style: WSD
lr-wsd-decay-style: cosine

# ── Parallelism (formerly h100x8.yaml) ─────────────────────────────────────
tensor-model-parallel-size: 1
pipeline-model-parallel-size: 1
expert-model-parallel-size: 8
expert-tensor-parallel-size: 1
context-parallel-size: 1
micro-batch-size: 3
global-batch-size: 1536

# ── Activation checkpointing ───────────────────────────────────────────────
recompute-granularity: selective
recompute-modules: "layernorm moe"

# ── MoE routing (DSV3-strict: aux-loss-free + complementary seq_aux_loss) ─
# Full DeepSeek-V3 alignment per paper Section 2.1.2:
#   • PRIMARY: aux-loss-free strategy via expert bias updates
#     (moe-router-enable-expert-bias=true, bias-update-rate=0.001)
#   • COMPLEMENTARY: sequence-wise auxiliary balance loss with extremely
#     small coefficient (moe-aux-loss-coeff=1.0e-4 in baseline_48L.yaml).
#     DSV3 paper: "to prevent extreme imbalance within any single sequence,
#     we also employ a complementary sequence-wise balance loss".
#   • Sigmoid score + group-limited routing (8 groups × top-4) + topk-scaling
#     2.5 from baseline_48L.yaml round out the DSV3 routing recipe.
#
# Deviation from prior alpha Stage 1 (kormo) recipe: that run used
# load-balancing-type=none (pure aux-loss-free, no seq_aux safety net).
# Switched to seq_aux_loss for proper DSV3 alignment per 2026-05-12 review.
# The 1e-4 coefficient is small enough that gradient contribution is
# nearly invisible vs lm loss, but the safety net prevents extreme
# intra-sequence routing collapse. Stage 2-2/2-3 already use this setting.
moe-router-load-balancing-type: seq_aux_loss
moe-router-score-function: sigmoid
moe-router-enable-expert-bias: true
moe-router-bias-update-rate: 0.001
moe-token-dispatcher-type: alltoall

# ── Optimizer (Muon) ───────────────────────────────────────────────────────
optimizer: dist_muon
weight-decay: 0.1   # Moonshot Muon paper recommendation
adam-beta1: 0.9
adam-beta2: 0.95
muon-momentum: 0.95
muon-use-nesterov: true       # store_true: emitted only when true (Nesterov bug auto-fixed)
muon-num-ns-steps: 5
muon-scale-mode: spectral
muon-fp32-matmul-prec: medium
muon-tp-mode: blockwise
muon-extra-scale-factor: 0.2
init-method-std: 0.008
clip-grad: 1.0

# ── QK-Clip (Muon stabilization, requires TE >= 2.9.0) ────────────────────
qk-clip: true
qk-clip-alpha: 0.5
qk-clip-threshold: 100
log-max-attention-logit: true

# ── LayerNorm WD (Qwen3-Next/Qwen3.5 official recipe) ─────────────────────
# Qwen3 family applies weight decay only to QK layernorm γ; other layernorms
# (pre-attn, pre-MoE, mamba RMSNormGated, etc.) are excluded from WD. This
# matches yanring/Megatron-MoE-ModelZoo Qwen3-Next-80B-A3B.yaml's
# `--no-weight-decay-cond-type: qwen3_next` (which is the same semantic as
# alpha's `apply_wd_to_qk_layernorm` in Megatron-LM-251125).
no-weight-decay-cond-type: apply_wd_to_qk_layernorm

# ── Document boundary handling (alpha hybrid recipe) ──────────────────────
# After Phase 0.0 / 0.4 of the 2026-05-12 pre-flight, every doc in the Stage 1
# .bin ends with token id 0 (= <|endoftext|>, the designated EOS/EOD).
#
# reset-attention-mask + eod-mask-loss handle doc boundaries for alpha:
#   • reset-attention-mask=true: zeros cross-doc attention in the 6 attention
#     layers (12.5% of layers). The 18 Mamba layers ignore attention masks;
#     state leakage across doc boundaries in Mamba is the accepted hybrid-SSM
#     convention (same as Qwen3-Next, Jamba, Mamba-2).
#   • eod-mask-loss=true: excludes EOD tokens from loss so the model isn't
#     trained to predict its own doc-end marker.
#
# reset-position-ids is INTENTIONALLY OFF for alpha hybrid:
#   1. Mamba/MoE layers don't read position_ids → no effect.
#   2. Attention layers' RoPE has the property <R_m Q, R_n K> = f(n-m), so
#      within-doc relative positions are preserved regardless of absolute
#      offset (N cancels: (N+i)-(N+j) = i-j). Cross-doc score values differ
#      between reset-on/off, but reset-attention-mask zeros them → softmax
#      and backward contribution is 0 in either case.
#   3. Forward outputs, gradients, and learned weights converge identically
#      with reset-position-ids on vs off for this architecture.
#   4. The patch-side get_batch (megatron_patch/template/helper.py:91-110)
#      auto-builds PackedSeqParams (THD/cu_seqlens) whenever this is true,
#      but MambaModel.forward() doesn't accept packed_seq_params (chunk-scan
#      Triton kernel has no cu_seqlens path) → AssertionError at iter 1.
#      Disabling here bypasses that path with zero functional impact.
reset-position-ids: false
reset-attention-mask: true
eod-mask-loss: true

# ── Precision ──────────────────────────────────────────────────────────────
bf16: true

# ── Checkpointing ──────────────────────────────────────────────────────────
save-interval: 10000
# no-save-optim removed: this preset SAVES optimizer state (Muon momentum +
# Adam moments + fp32 masters) for exact-resume testing / long-run safety.
ckpt-format: torch_dist

# ── Eval ───────────────────────────────────────────────────────────────────
eval-iters: 3
eval-interval: 10000

# ── Logging / runtime ──────────────────────────────────────────────────────
log-interval: 1
log-timers-to-tensorboard: true
log-memory-to-tensorboard: true
log-validation-ppl-to-tensorboard: true
log-throughput: true
tensorboard-queue-size: 1
distributed-timeout-minutes: 60
manual-gc: true
manual-gc-interval: 5

# ── Performance knobs (formerly hardcoded in shell INFRA_ARGS) ────────────
overlap-grad-reduce: true
attention-backend: auto       # TE picks fused for QK-Clip return_max_logit, flash otherwise
cross-entropy-loss-fusion: true
cross-entropy-fusion-impl: te

# ── WANDB ──────────────────────────────────────────────────────────────────
# API key comes from WANDB_API_KEY env (set by scripts/setup_wandb.sh).
# Do NOT inline the key here.
wandb-project: alpha-pretraining
