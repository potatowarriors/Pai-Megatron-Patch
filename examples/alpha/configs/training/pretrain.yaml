# Alpha 사전학습 설정
# Baseline configuration for pretraining

training:
  # 학습량 설정 (1 epoch on 50% subset = ~1.13T tokens)
  # 방법 1: train_samples - 실제 데이터셋 샘플 수 기반으로 정확한 1 epoch 학습 (bc 필요)
  # 방법 2: train_tokens - 토큰 수 기반 계산 (정수 연산만 사용)
  # 50% subset: DCLM(1.02T) + korean_web(0.11T) = 1.13T tokens
  # With seq_len=4096, GBS=1024: ~269,440 iterations
  train_tokens: 1130112331960  # ~1.13T tokens (1 epoch)

  # Warmup 설정
  # 방법 1: lr_warmup_fraction - train_iters에 대한 비율 (bc 필요)
  # 방법 2: warmup_tokens - 토큰 수 기반 (정수 연산만 사용)
  # lr_warmup_fraction: 0.03
  warmup_tokens: 33903369959   # ~3% warmup (~34B tokens)

  # WSD Scheduler 설정
  # Phase: Warmup (3%) → Stable (87%) → Decay (10%)
  lr_wsd_decay_style: "cosine"  # Options: exponential, linear, cosine, minus_sqrt
  lr_wsd_decay_tokens: 113011233196  # 마지막 10% (~113B tokens)에서 decay

  # Optimizer
  optimizer: "dist_muon"  # Options: adam, sgd, muon, dist_muon
  weight_decay: 0.01

  # Adam hyperparameters (when using adam)
  adam_beta1: 0.9
  adam_beta2: 0.95

  # Muon hyperparameters (when using muon/dist_muon)
  muon_momentum: 0.95
  muon_use_nesterov: true
  muon_num_ns_steps: 5
  muon_scale_mode: "spectral"  # Options: spectral, unit_rms_norm, shape_scaling
  muon_fp32_matmul_prec: "medium"  # Options: low, medium, high
  muon_tp_mode: "blockwise"  # Options: blockwise, duplicated, distributed
  muon_extra_scale_factor: 1.0

  # QK-Clip (Muon training stabilization)
  # DISABLED: FA3 doesn't support max_logit yet (https://github.com/Dao-AILab/flash-attention/issues/1876)
  # TE 2.9.0 falls back to slow Unfused backend when enabled
  # Will re-enable when FA3 + TE support is ready
  qk_clip: false
  qk_clip_alpha: 0.5
  qk_clip_threshold: 100

  # Common
  init_method_std: 0.008
  clip_grad: 1.0

  # Learning Rate
  lr: 1.0e-4
  min_lr: 1.0e-4
  lr_decay_style: "WSD"  # Warmup-Stable-Decay (Muon과 잘 맞음)

  # Precision
  precision: "bf16"

  # 체크포인트
  save_interval: 50000
  save_optim: false
  auto_detect_ckpt_format: false
  ckpt_format: "torch_dist"  # Muon supports both torch and torch_dist (Megatron-LM-251125+)

  # 평가
  eval_iters: 8
  eval_interval: 50000

  # 분산 학습
  distributed_timeout_minutes: 60
  manual_gc: true
  manual_gc_interval: 5

  # 로깅
  log_interval: 1
  log_timers_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_validation_ppl_to_tensorboard: true
  log_throughput: true

  # Weights & Biases
  wandb:
    enabled: true  # true로 변경하면 WANDB 활성화
    api_key: "ffbe195db0033ed7b92ba142cfd01ca70b29974d"  # WANDB API 키 (https://wandb.ai/authorize 에서 발급)
    project: "alpha-pretraining"
    entity: ""  # 팀/조직 이름 (선택사항)
    save_dir: ""  # 기본값: {checkpoint_dir}/wandb
    notes: "Alpha project baseline experiments"
