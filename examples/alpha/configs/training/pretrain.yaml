# Alpha 사전학습 설정
# Baseline configuration for pretraining

training:
  # 학습 토큰
  train_tokens: 10663817216    # ~10.7B tokens
  warmup_tokens: 319815680     # ~320M tokens (전체 iteration의 3%, 305 iters)

  # Optimizer
  optimizer: "adam"
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.95
  init_method_std: 0.008
  clip_grad: 1.0

  # Learning Rate
  lr: 3.0e-3
  min_lr: 3.0e-4
  lr_decay_style: "cosine"

  # Precision
  precision: "bf16"

  # 체크포인트
  save_interval: 1000
  save_optim: false
  auto_detect_ckpt_format: true

  # 평가
  eval_iters: 10
  eval_interval: 1000

  # 분산 학습
  distributed_timeout_minutes: 60
  manual_gc: true
  manual_gc_interval: 5

  # 로깅
  log_interval: 1
  log_timers_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_validation_ppl_to_tensorboard: true
  log_throughput: true

  # Weights & Biases
  wandb:
    enabled: true  # true로 변경하면 WANDB 활성화
    project: "alpha-pretraining"
    entity: ""  # 팀/조직 이름 (선택사항)
    save_dir: ""  # 기본값: {checkpoint_dir}/wandb
    notes: "Alpha project baseline experiments"
