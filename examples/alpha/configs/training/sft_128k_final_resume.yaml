# SFT 최종 단일 런 — 재개 프리셋 (A iter 150 ckpt 에서 이어감, 사용자 결정 2026-09-14 01:00: DiLoCo A/B 후 단일 노드 확정, 01:15 "A로 진행")
#
#   bash train.sh baseline_48L sft_128k_final_resume sft_128k_final_blend        # main1
#
# sft_128k_final.yaml 전체 복제 + 차이 2가지: ① load: = A 런(alpha_baseline_48L_sft_128k_final_20260913_022854, 본 런 프리셋으로 150 iters
#   완주, optimizer state 포함 153 GB) ② finetune:/no-load-optim: 제거 — 같은 dataset 연장이라 optimizer·스케줄러·RNG·consumed_samples(24,000)를
#   그대로 이어받는다 (KNOWN_ISSUES 09-01 ⑥: 재개 프리셋에 finetune/no-load-optim 이 남으면 warmup 재시작·Muon 리셋).
# 예산·LR 은 본 런과 동일: train-samples 457,920 (2,862 iters, 잔여 2,712), cosine 2.5e-5 → 1.5e-6. save 300 / eval(valid) 100 (사용자 09-14).
# 평가 체인은 sub1 에서 병행: scripts/sft_final_eval_watch.sh (300 iters 마다 probe + T1; 변환은 sub1 8 GPU).
# 2026-09-15 재개 2차: 09-14 01:38 재개 런(…final_resume_20260914_013856)이 main1 GPU7 장애로 iter 441 에서 사망 → load: 를 그 런의
#   checkpoints(latest = iter 300, optimizer 포함) 로 변경. A 런 iter150 → 013856 iter300 → (이 프리셋) 계보. 잔여 2,562 iters.
#   같은 dataset 연장이므로 finetune/no-load-optim 없음 그대로 (KNOWN_ISSUES 09-01 ⑥). 절차: RESTORE_AFTER_REBOOT.md §7.4.
# 2026-09-16 재개 3차: 09-15 17:43 sub1 재개 런(…final_resume_20260915_174309, save 100)이 iter 601 에서 컴퓨팅 세션 재생성(20:28)으로 사망 →
#   load: 를 그 런의 checkpoints(latest = iter 600, optimizer 포함) 로 변경. 계보 A iter150 → 013856 iter300 → 174309 iter600 → (이 프리셋). 잔여 2,262 iters.
#   사용자 결정 09-16 21:15: sub1 에서 즉시 재개(main1 GPU7 미수리). 절차 RESTORE_AFTER_REBOOT.md §7.7.
train-mode: finetune

# ── 예산 / LR ─────────────────────────────────────────────────────────────
train-samples: 457920             # 2,862 iters @ GBS 160 (60.02B; sft_128k_final_blend.yaml)
lr-warmup-samples: 21440          # 134 iters (4.7%)
lr-decay-samples: 457920
lr: 2.5e-5
min-lr: 1.5e-6
lr-decay-style: cosine

# ── 병렬화 (128K = CP8 강제; offload 로 GO — MUON_OFFLOAD_BACKPORT S5) ────
tensor-model-parallel-size: 1
pipeline-model-parallel-size: 1
expert-model-parallel-size: 8
expert-tensor-parallel-size: 1
context-parallel-size: 8

chunked-optimizer-state-offload: true
optimizer-state-offload-chunk-size-mb: 256

# ── 배치 / 시퀀스 (THD는 MBS 1 필수 — helper assert) ──────────────────────
seq-length: 131072
micro-batch-size: 1
# GBS 160 = 20.97M tok/iter (사용자, 2026-08-28: Ultra SFT 18.9M 스케일).
# 실측(2-iter 스모크): 329.7s/iter = 63.6k tok/s, 263 TFLOP/s — GBS 96(62.9k) 대비
# +1% 로 처리량은 사실상 동일(iter 고정비 ~6s). 근거는 최적화 설계: Ultra 배치
# 동일 스케일·스텝 2,448(Ultra 3,200 동급)·LR 비율 이식 무보정. 메모리 불변(MBS 1).
global-batch-size: 160

# ── THD 문서 격리 플래그셋 (SFT 경로: 음수 마커 기반 리셋, EOD 무관) ──────
reset-position-ids: true
no-create-attention-mask-in-dataloader: true
reset-attention-mask: false
eod-mask-loss: false

# ── 리컴퓨트 ──────────────────────────────────────────────────────────────
recompute-granularity: selective
recompute-modules: "layernorm moe"

# ── MoE 라우팅 (DSV3-strict, 전 스테이지 동일) ────────────────────────────
moe-router-load-balancing-type: seq_aux_loss
moe-router-score-function: sigmoid
moe-router-enable-expert-bias: true
moe-router-bias-update-rate: 0.001
moe-token-dispatcher-type: alltoall

# ── Optimizer (전 스테이지 연속성: Muon 유지) ─────────────────────────────
optimizer: dist_muon
weight-decay: 0.1
adam-beta1: 0.9
adam-beta2: 0.95
muon-momentum: 0.95
muon-use-nesterov: true
muon-num-ns-steps: 5
muon-scale-mode: spectral
muon-fp32-matmul-prec: medium
muon-tp-mode: blockwise
muon-extra-scale-factor: 0.2
init-method-std: 0.008

clip-grad: 8.0                    # ×cp 산식 (lc_a.yaml 실측), CP8

# ── LayerNorm WD ──────────────────────────────────────────────────────────
no-weight-decay-cond-type: apply_wd_to_qk_layernorm

# ── Precision ─────────────────────────────────────────────────────────────
bf16: true

# ── 체크포인트 / 평가 (2,862 iters 규모) ──────────────────────────────────
save-interval: 100                # 사용자 2026-09-15 17:40: main1 GPU7 하드웨어 장애(Xid 109/120)로 sub1 임시 학습 — 중단 손실을 ≈9 h 로 제한.
                                  # 잔여 2,562 iters → 26회 × 153 GB ≈ 4 TB (NFS 여유 18 TB). 이전 300 (09-14 01:40: 저장+valid 11분/회) 은 main1 복귀 시 재검토
# optimizer state 저장 기본 (63c466f) — 무봉합 재개
ckpt-format: torch_dist
eval-iters: 4
eval-interval: 100
# 58 멤버 valid 분할의 Σceil 부풀림 대비 버퍼 (KNOWN_ISSUES 09-09 IndexError)
mid-level-dataset-surplus: 0.05

# ── 로깅 / 런타임 ─────────────────────────────────────────────────────────
log-interval: 1
log-timers-to-tensorboard: true
log-memory-to-tensorboard: true
log-validation-ppl-to-tensorboard: true
log-throughput: true
tensorboard-queue-size: 1
# 26종 128k 콜드 캐시 빌드 실측 25분 (64k 는 80분+) — 콜드 재빌드 대비 여유
distributed-timeout-minutes: 180
manual-gc: true
manual-gc-interval: 5
overlap-grad-reduce: true
attention-backend: auto
cross-entropy-loss-fusion: true
cross-entropy-fusion-impl: te
wandb-project: alpha-posttraining

# ── 재개 (같은 dataset 연장: load 만, finetune/no-load-optim 없음 — KNOWN_ISSUES 09-01 ⑥). 09-15: iter 300 → 09-16: iter 600 ckpt 로 갱신 ──
load: /home/work/vidsearch/repos/project_s/Pai-Megatron-Patch/examples/alpha/outputs/alpha_baseline_48L_sft_128k_final_resume_20260915_174309/checkpoints
