# Stage 2-3 continuation: 375k → 800k with 4× LR boost + LayerNorm WD on.
#
# Stage 2-2 stopped at 375k (before its planned 400k). Stage 2-3 picks up
# from there for another 425k iters (final global iter = 800k), while:
#   - LR 1e-4 → 4e-4 (4× boost from other technical reports)
#   - Min LR 1e-5 → 4e-5 (10% of max)
#   - Warmup 500 → 2000 (handles the ~30× LR jump smoothly)
#   - LayerNorm WD: apply_wd_to_qk_layernorm → apply_wd_to_all_layernorm
#     (zero-centered standard LNs all get WD; Mamba RMSNormGated excluded
#     by the monkey-patch in pretrain_alpha.py)
#
# Cosine schedule (scheduler-fresh-start basis):
#   warmup: step 0 → 2,000   (init_lr → 4e-4)
#   decay:  step 2,000 → 425,000  (cosine, 4e-4 → 4e-5)
# Maps to global iter 375000 → 377000 (warmup) → 800000 (decay end).

# ── Iteration schedule ─────────────────────────────────────────────────────
train-iters: 800000
lr-warmup-iters: 2000
lr-decay-iters: 425000

# ── LR ──────────────────────────────────────────────────────────────────────
lr: 4.0e-4
min-lr: 4.0e-5
lr-decay-style: cosine

# ── Parallelism ────────────────────────────────────────────────────────────
tensor-model-parallel-size: 1
pipeline-model-parallel-size: 1
expert-model-parallel-size: 8
expert-tensor-parallel-size: 1
context-parallel-size: 1
micro-batch-size: 4
global-batch-size: 256

# ── Activation checkpointing ───────────────────────────────────────────────
recompute-granularity: selective
recompute-modules: "layernorm moe"

# ── MoE routing (DSV3-style: seq_aux_loss + sigmoid + expert bias) ────────
# Switched from aux_loss/softmax to DSV3 best practice. baseline_48L.yaml
# carries the static DSV3 flags (num-groups/group-topk/topk-scaling-factor).
moe-router-load-balancing-type: seq_aux_loss
moe-router-score-function: sigmoid
moe-router-enable-expert-bias: true
moe-router-bias-update-rate: 0.001
moe-token-dispatcher-type: alltoall

# ── Optimizer (Muon) ───────────────────────────────────────────────────────
optimizer: dist_muon
weight-decay: 0.01
adam-beta1: 0.9
adam-beta2: 0.95
muon-momentum: 0.95
muon-use-nesterov: true
muon-num-ns-steps: 5
muon-scale-mode: spectral
muon-fp32-matmul-prec: medium
muon-tp-mode: blockwise
muon-extra-scale-factor: 0.2
init-method-std: 0.008
clip-grad: 1.0

# ── QK-Clip ────────────────────────────────────────────────────────────────
qk-clip: true
qk-clip-alpha: 0.5
qk-clip-threshold: 100
log-max-attention-logit: true

# ── LayerNorm WD (Qwen3-Next/Qwen3.5 official recipe) ─────────────────────
# Reverted from apply_wd_to_all_layernorm to QK-only WD to match Qwen3 family
# official recipe (yanring/Megatron-MoE-ModelZoo Qwen3-Next: qwen3_next mode).
no-weight-decay-cond-type: apply_wd_to_qk_layernorm

# ── Resume from Stage 2-2 final checkpoint ────────────────────────────────
load: /home/work/vidsearch/repos/project_s/Pai-Megatron-Patch/examples/alpha/outputs/alpha_baseline_48L_stage2_20260330_160918/checkpoints
no-load-optim: true

# ── Precision / checkpointing / eval / logging ────────────────────────────
bf16: true
save-interval: 25000
no-save-optim: true
ckpt-format: torch_dist
eval-iters: 8
eval-interval: 25000
log-interval: 1
log-timers-to-tensorboard: true
log-memory-to-tensorboard: true
log-validation-ppl-to-tensorboard: true
log-throughput: true
tensorboard-queue-size: 1
distributed-timeout-minutes: 60
manual-gc: true
manual-gc-interval: 5

# ── Performance knobs ──────────────────────────────────────────────────────
overlap-grad-reduce: true
attention-backend: auto
cross-entropy-loss-fusion: true
cross-entropy-fusion-impl: te

# ── WANDB ──────────────────────────────────────────────────────────────────
wandb-project: alpha-pretraining
