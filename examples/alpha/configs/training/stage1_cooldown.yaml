# Alpha Stage1 Cooldown 학습 설정
# 400k → 440k iteration (3k warmup + 37k cosine decay)
#
# 사용법:
#   1. resume.load_checkpoint_path 확인 후 실행
#   2. bash train_cooldown.sh baseline_48L stage1_cooldown h100x8 kormo_50pct
#
# 원리:
#   --no-save-optim으로 저장된 체크포인트에는 scheduler 상태가 없음
#   --no-load-optim으로 resume하면 scheduler가 num_steps=0에서 시작
#   → 새로운 warmup + cosine decay 스케줄 자동 적용
#
# 데이터셋: kormo_50pct (~1.13T tokens, 1 epoch ≈ 1,078k iters)
# 원래 계획: 1,078k iterations (WSD scheduler, 1 epoch)
# 조기 중단: 400k iterations
# Cooldown:  40k iterations (400k → 440k)

training:
  # Resume 설정
  resume:
    enabled: true
    load_checkpoint_path: "/home/work/vidsearch/repos/project_s/Pai-Megatron-Patch/examples/alpha/outputs/alpha_baseline_48L_20251219_095156/checkpoints"
    no_load_optim: true         # 필수 (--no-save-optim 체크포인트)

  # Iteration (직접 지정, token 기반 계산 불필요)
  train_iters: 440000           # 절대값 (400k + 40k)
  lr_warmup_iters: 3000         # 3k warmup
  lr_decay_iters: 40000         # 전체 스케줄 범위 (warmup 3k + cosine 37k = 40k)

  # LR Schedule — cosine으로 전환 (WSD의 stable 구간 불필요)
  lr: 1.0e-4
  min_lr: 1.0e-5
  lr_decay_style: "cosine"

  # Optimizer (pretrain.yaml과 동일)
  optimizer: "dist_muon"
  weight_decay: 0.01
  muon_momentum: 0.95
  muon_use_nesterov: true
  muon_num_ns_steps: 5
  muon_scale_mode: "spectral"
  muon_fp32_matmul_prec: "medium"
  muon_tp_mode: "blockwise"
  muon_extra_scale_factor: 1.0
  adam_beta1: 0.9
  adam_beta2: 0.95
  init_method_std: 0.008
  clip_grad: 1.0

  # QK-Clip (disabled — same as pretrain.yaml)
  qk_clip: false

  # Checkpoint (더 자주 저장)
  save_interval: 10000
  eval_iters: 8
  eval_interval: 10000
  ckpt_format: "torch_dist"
  precision: "bf16"

  # 기타 (pretrain.yaml과 동일)
  distributed_timeout_minutes: 60
  manual_gc_interval: 5
  log_interval: 1

  # Weights & Biases
  wandb:
    enabled: true
    project: "alpha-pretraining"
    entity: ""
    save_dir: ""
    notes: "Stage1 Cooldown (400k → 440k, cosine decay)"
