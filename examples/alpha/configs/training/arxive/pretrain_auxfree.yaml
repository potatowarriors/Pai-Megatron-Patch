# ⚠️  DEPRECATED (2026-05-12): Stage 1 now uses configs/training/stage1.yaml.
# This file is retained temporarily for git-history reference and to avoid
# breaking any in-flight scripts. Do NOT use for new runs.
# Differences vs stage1.yaml: lr 4e-4 → 2e-4, global-batch-size 2688 → 1536,
# save-interval 25000 → 10000, eval cadence tightened.
#
# Stage 1 from-scratch pretraining with aux-loss-free MoE routing.
#
# All keys are Megatron CLI flag names — `train.sh` expands them via
# yaml_to_flags. Derived values (train-iters from token budget) are baked
# in directly with the formula in a comment, not recomputed in shell.
#
# Schedule: WSD (warmup-stable-decay) over 450k iters
#   warmup:  iter 0       → 2,000    (linear, init_lr → lr=4e-4)
#   stable:  iter 2,000   → 405,000  (flat at lr=4e-4)
#   decay:   iter 405,000 → 450,000  (cosine, lr → min_lr=4e-5)
#
# Token budget: 450k × GBS(256) × seq_len(4096) ≈ 0.47T tokens
# (~0.42 epoch over kormo_50pct's ~1.13T tokens)

# ── Iteration schedule ─────────────────────────────────────────────────────
train-iters: 450000
lr-warmup-iters: 2000
lr-decay-iters: 450000        # WSD: full scope
lr-wsd-decay-iters: 45000     # last 10% is the decay phase

# ── LR ──────────────────────────────────────────────────────────────────────
lr: 4.0e-4
min-lr: 4.0e-5
lr-decay-style: WSD
lr-wsd-decay-style: cosine

# ── Parallelism (formerly h100x8.yaml) ─────────────────────────────────────
tensor-model-parallel-size: 1
pipeline-model-parallel-size: 1
expert-model-parallel-size: 8
expert-tensor-parallel-size: 1
context-parallel-size: 1
micro-batch-size: 3
global-batch-size: 2688

# ── Activation checkpointing ───────────────────────────────────────────────
recompute-granularity: selective
recompute-modules: "layernorm moe"

# ── MoE routing (Stage 1 auxfree: bias-based, sigmoid score) ──────────────
# Already DSV3-aligned on sigmoid + expert bias + 1e-3 bias rate. We keep
# load-balancing-type=none here (purely aux-loss-free) rather than DSV3's
# seq_aux_loss safety net, to preserve alpha's validated Stage 1 recipe.
# Stage 2 presets (stage2_*.yaml) switch to seq_aux_loss for DSV3 alignment.
moe-router-load-balancing-type: none
moe-router-score-function: sigmoid
moe-router-enable-expert-bias: true
moe-router-bias-update-rate: 0.001
moe-token-dispatcher-type: alltoall

# ── Optimizer (Muon) ───────────────────────────────────────────────────────
optimizer: dist_muon
weight-decay: 0.1   # Moonshot Muon paper recommendation
adam-beta1: 0.9
adam-beta2: 0.95
muon-momentum: 0.95
muon-use-nesterov: true       # store_true: emitted only when true (Nesterov bug auto-fixed)
muon-num-ns-steps: 5
muon-scale-mode: spectral
muon-fp32-matmul-prec: medium
muon-tp-mode: blockwise
muon-extra-scale-factor: 0.2
init-method-std: 0.008
clip-grad: 1.0

# ── QK-Clip (Muon stabilization, requires TE >= 2.9.0) ────────────────────
qk-clip: true
qk-clip-alpha: 0.5
qk-clip-threshold: 75
log-max-attention-logit: true

# ── LayerNorm WD (Qwen3-Next/Qwen3.5 official recipe) ─────────────────────
# Qwen3 family applies weight decay only to QK layernorm γ; other layernorms
# (pre-attn, pre-MoE, mamba RMSNormGated, etc.) are excluded from WD. This
# matches yanring/Megatron-MoE-ModelZoo Qwen3-Next-80B-A3B.yaml's
# `--no-weight-decay-cond-type: qwen3_next` (which is the same semantic as
# alpha's `apply_wd_to_qk_layernorm` in Megatron-LM-251125).
no-weight-decay-cond-type: apply_wd_to_qk_layernorm

# ── Document boundary handling (frontier Megatron recipe) ─────────────────
# After Phase 0.0 / 0.4 of the 2026-05-12 pre-flight, every doc in the Stage 1
# .bin ends with token id 0 (= <|endoftext|>, the designated EOS/EOD). These
# three flags activate the standard Megatron document-aware packing: position
# IDs reset at each EOD within a packed sample, attention masks zero out
# cross-doc context, and EOD tokens are masked from the loss so the model
# isn't trained to predict its own doc-end marker. Required by yanring/
# Megatron-MoE-ModelZoo Qwen3-Next-80B-A3B reference recipe; aligns with
# Llama 3 / DSV3 / NeMo defaults. Pre-flight verified that <|endoftext|>
# (id 0) is present at every doc end in DCLM / korean_web / fineweb2hq.
reset-position-ids: true
reset-attention-mask: true
eod-mask-loss: true

# ── Precision ──────────────────────────────────────────────────────────────
bf16: true

# ── Checkpointing ──────────────────────────────────────────────────────────
save-interval: 25000
no-save-optim: true           # Muon recovers via warmup; verified in Stage 1 cooldown
ckpt-format: torch_dist

# ── Eval ───────────────────────────────────────────────────────────────────
eval-iters: 8
eval-interval: 25000

# ── Logging / runtime ──────────────────────────────────────────────────────
log-interval: 1
log-timers-to-tensorboard: true
log-memory-to-tensorboard: true
log-validation-ppl-to-tensorboard: true
log-throughput: true
tensorboard-queue-size: 1
distributed-timeout-minutes: 60
manual-gc: true
manual-gc-interval: 5

# ── Performance knobs (formerly hardcoded in shell INFRA_ARGS) ────────────
overlap-grad-reduce: true
attention-backend: auto       # TE picks fused for QK-Clip return_max_logit, flash otherwise
cross-entropy-loss-fusion: true
cross-entropy-fusion-impl: te

# ── WANDB ──────────────────────────────────────────────────────────────────
# API key comes from WANDB_API_KEY env (set by scripts/setup_wandb.sh).
# Do NOT inline the key here.
wandb-project: alpha-pretraining
