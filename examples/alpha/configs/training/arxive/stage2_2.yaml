# Stage 2-2 continuation: 200k → 400k with cosine decay.
#
# Resumes from stage2 200k checkpoint, keeps consumed_samples (same dataset),
# resets optimizer/scheduler (--no-load-optim) for fresh cosine schedule.
#
# Cosine schedule (scheduler-fresh-start basis, global iter 200001..400000):
#   warmup: step 0 → 500
#   decay:  step 500 → 200,000 (cosine, 1e-4 → 1e-5)

# ── Iteration schedule ─────────────────────────────────────────────────────
train-iters: 400000           # global iter target
lr-warmup-iters: 500
lr-decay-iters: 200000        # cosine completes in 200k scheduler steps

# ── LR ──────────────────────────────────────────────────────────────────────
lr: 1.0e-4
min-lr: 1.0e-5
lr-decay-style: cosine

# ── Parallelism ────────────────────────────────────────────────────────────
tensor-model-parallel-size: 1
pipeline-model-parallel-size: 1
expert-model-parallel-size: 8
expert-tensor-parallel-size: 1
context-parallel-size: 1
micro-batch-size: 4
global-batch-size: 256

# ── Activation checkpointing ───────────────────────────────────────────────
recompute-granularity: selective
recompute-modules: "layernorm moe"

# ── MoE routing (DSV3-style: seq_aux_loss + sigmoid + expert bias) ────────
# Switched from aux_loss/softmax to DSV3 best practice. baseline_48L.yaml
# carries the static DSV3 flags (num-groups/group-topk/topk-scaling-factor).
moe-router-load-balancing-type: seq_aux_loss
moe-router-score-function: sigmoid
moe-router-enable-expert-bias: true
moe-router-bias-update-rate: 0.001
moe-token-dispatcher-type: alltoall

# ── Optimizer (Muon) ───────────────────────────────────────────────────────
optimizer: dist_muon
weight-decay: 0.01
adam-beta1: 0.9
adam-beta2: 0.95
muon-momentum: 0.95
muon-use-nesterov: true
muon-num-ns-steps: 5
muon-scale-mode: spectral
muon-fp32-matmul-prec: medium
muon-tp-mode: blockwise
muon-extra-scale-factor: 0.2
init-method-std: 0.008
clip-grad: 1.0

# ── QK-Clip ────────────────────────────────────────────────────────────────
qk-clip: true
qk-clip-alpha: 0.5
qk-clip-threshold: 100
log-max-attention-logit: true

# ── LayerNorm WD ───────────────────────────────────────────────────────────
no-weight-decay-cond-type: apply_wd_to_qk_layernorm

# ── Resume (Stage 2-N → 2-N+1: keep data position, reset optimizer) ───────
load: /home/work/vidsearch/repos/project_s/Pai-Megatron-Patch/examples/alpha/outputs/alpha_baseline_48L_stage2_20260301_015403/checkpoints
no-load-optim: true

# ── Precision / checkpointing / eval / logging ────────────────────────────
bf16: true
save-interval: 25000
no-save-optim: true
ckpt-format: torch_dist
eval-iters: 8
eval-interval: 25000
log-interval: 1
log-timers-to-tensorboard: true
log-memory-to-tensorboard: true
log-validation-ppl-to-tensorboard: true
log-throughput: true
tensorboard-queue-size: 1
distributed-timeout-minutes: 60
manual-gc: true
manual-gc-interval: 5

# ── Performance knobs ──────────────────────────────────────────────────────
overlap-grad-reduce: true
attention-backend: auto
cross-entropy-loss-fusion: true
cross-entropy-fusion-impl: te

# ── WANDB ──────────────────────────────────────────────────────────────────
wandb-project: alpha-pretraining
