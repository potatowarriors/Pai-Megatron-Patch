# Alpha Stage 2 학습 설정
# Cooldown(440k) → Stage 2 (400k, WSD)
#
# 전략:
#   - --finetune으로 iteration=0, consumed_samples=0 리셋 (새 dataset)
#   - WSD 스케줄 400k 기준
#   - save_optim: false → optimizer 저장 안 함 (warmup으로 복구)
#
# 사용법:
#   1. resume.load_checkpoint_path 확인 후 실행
#   2. bash train_stage2.sh baseline_48L stage2 h100x8 stage2
#
# WSD 스케줄 (400k 기준):
#   - Warmup: step 0 → 12,000 (3%)
#   - Stable: step 12,000 → 360,000
#   - Decay:  step 360,000 → 400,000 (10%)
#
# 데이터셋: stage2 blend (~3.1T tokens)

training:
  # Resume 설정
  resume:
    enabled: true
    load_checkpoint_path: "/home/work/vidsearch/repos/project_s/Pai-Megatron-Patch/examples/alpha/outputs/alpha_baseline_48L_ablation_20260219_184545/checkpoints"
    finetune: true              # iteration=0, consumed_samples=0 리셋 (새 dataset)

  # Iteration 설정 (400k 기준)
  train_iters: 400000           # 400k
  lr_warmup_iters: 12000        # 3% of 400k
  lr_decay_iters: 400000        # 400k scope
  lr_wsd_decay_iters: 40000     # 10% of 400k

  # LR Schedule — WSD (Warmup-Stable-Decay)
  lr: 1.0e-4
  min_lr: 1.0e-5
  lr_decay_style: "WSD"
  lr_wsd_decay_style: "cosine"

  # QK-Clip (cuDNN 업데이트 완료)
  qk_clip: true
  qk_clip_alpha: 0.5
  qk_clip_threshold: 100
  no_weight_decay_cond_type: apply_wd_to_qk_layernorm

  # Optimizer (pretrain.yaml과 동일)
  optimizer: "dist_muon"
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.95
  muon_momentum: 0.95
  muon_use_nesterov: true
  muon_num_ns_steps: 5
  muon_scale_mode: "spectral"
  muon_fp32_matmul_prec: "medium"
  muon_tp_mode: "blockwise"
  muon_extra_scale_factor: 1.0
  init_method_std: 0.008
  clip_grad: 1.0

  # Checkpoint
  save_interval: 25000
  save_optim: false             # optimizer 리셋 후 warmup으로 충분 (Stage1 cooldown 검증 완료)
  ckpt_format: "torch_dist"
  precision: "bf16"

  # 평가
  eval_iters: 8
  eval_interval: 25000

  # 기타 (pretrain.yaml과 동일)
  distributed_timeout_minutes: 60
  manual_gc_interval: 5
  log_interval: 1

  # Weights & Biases
  wandb:
    enabled: true
    project: "alpha-pretraining"
    entity: ""
    save_dir: ""
    notes: "Stage 2 (400k, WSD, All-to-All, QK-Clip)"
